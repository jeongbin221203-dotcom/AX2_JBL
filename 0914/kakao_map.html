<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 기본 예제</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- 카카오맵 SDK 로드 (발급받은 JavaScript 키 입력) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_JAVASCRIPT_KEY"></script>
</head>
<body>

    <!-- 지도를 띄울 컨테이너 -->
    <div id="map"></div>

    <script>
        // 1. 지도 컨테이너 및 옵션 설정
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울시청 중심 좌표
            level: 3 // 확대 축소 레벨 (숫자가 작을수록 확대)
        };

        // 2. 지도 생성
        const map = new kakao.maps.Map(container, options);

        // 3. 지도 컨트롤 추가 (줌 컨트롤, 맵타입 컨트롤)
        const zoomControl = new kakao.maps.ZoomControl();
        map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

        const mapTypeControl = new kakao.maps.MapTypeControl();
        map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);

        // 4. 기본 마커 생성 및 표시
        const markerPosition = new kakao.maps.LatLng(37.5665, 126.9780);
        const marker = new kakao.maps.Marker({
            position: markerPosition
        });
        marker.setMap(map);

        // 5. 인포윈도우(말풍선) 추가
        const iwContent = '<div style="padding:5px; font-size:12px;">서울시청</div>';
        const infowindow = new kakao.maps.InfoWindow({
            content: iwContent
        });
        infowindow.open(map, marker);
    </script>
</body>
</html>
